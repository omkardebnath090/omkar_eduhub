<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.Ed. Notes Viewer | Omkar EduHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0F2A44;
    --navy-800:#163A5C;
    --navy-700:#1F4E78;
    --orange-500:#F5821F;
    --orange-400:#FBA23F;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --ink:#152233;
    --ink-soft:#5C6B7C;
    --border:#E3E8EF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .topbar{
    background:linear-gradient(135deg, var(--navy-900), var(--navy-700));
    padding:22px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
  }
  .topbar img{
    height:44px;
    display:block;
  }
  .back{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:.9rem;
    color:#EAF1FA;
    background:rgba(255,255,255,.08);
    padding:8px 16px;
    border-radius:999px;
    text-decoration:none;
  }
  .back:hover{background:rgba(255,255,255,.16);}

  .wrap{
    max-width:1040px;
    margin:0 auto;
    padding:32px 24px 60px;
  }
  .head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:20px;
  }
  .kicker{
    font-size:.85rem;
    font-weight:600;
    letter-spacing:.03em;
    color:var(--orange-500);
    margin:0 0 6px;
  }
  h1{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:1.9rem;
    margin:0;
    color:var(--navy-900);
  }
  .download{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:.9rem;
    color:#fff;
    text-decoration:none;
    background:var(--orange-500);
    padding:11px 20px;
    border-radius:10px;
    white-space:nowrap;
    transition:background .15s ease;
  }
  .download:hover{background:#DD6E0F;}

  .frame-shell{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    box-shadow:0 12px 24px rgba(15,42,68,.06);
  }
  iframe{
    width:100%;
    height:80vh;
    border:none;
    display:block;
    border-radius:8px;
  }
  .missing{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .missing a{color:var(--navy-800); font-weight:600;}
</style>
</head>
<body>
  <div class="topbar">
    <img src="assets/omkar-eduhub-logo.png" alt="Omkar EduHub">
    <a class="back" href="bed-notes.html">&larr; Back to all notes</a>
  </div>

  <div class="wrap">
    <div id="content"></div>
  </div>

<script>
  // Keep this list identical (id, title, file, semester) to the one in bed-notes.html
  const papers = {
    "1.1.1": { title: "Course 1.1.1", file: "notes/bed/sem1/1-1-1.pdf", semester: "Semester 1" },
    "1.1.2": { title: "Course 1.1.2", file: "notes/bed/sem1/1-1-2.pdf", semester: "Semester 1" },
    "1.1.4": { title: "Course 1.1.4", file: "notes/bed/sem1/1-1-4.pdf", semester: "Semester 1" },
    "1.1.5": { title: "Course 1.1.5", file: "notes/bed/sem1/1-1-5.pdf", semester: "Semester 1" },
    "1.1.EPC-1": { title: "Course 1.1.EPC-1", file: "notes/bed/sem1/1-1-epc1.pdf", semester: "Semester 1" },
    "2.1.1": { title: "Course 2.1.1", file: "notes/bed/sem2/2-1-1.pdf", semester: "Semester 2" },
    "2.1.2": { title: "Course 2.1.2", file: "notes/bed/sem2/2-1-2.pdf", semester: "Semester 2" },
    "2.1.3": { title: "Course 2.1.3", file: "notes/bed/sem2/2-1-3.pdf", semester: "Semester 2" }
  };

  const params = new URLSearchParams(window.location.search);
  const paperId = params.get("paper");
  const paper = paperId ? papers[paperId] : null;
  const content = document.getElementById("content");

  if (paper) {
    content.innerHTML = `
      <div class="head">
        <div>
          <p class="kicker">${paper.semester} &middot; ${paperId}</p>
          <h1>${paper.title}</h1>
        </div>
        <a class="download" href="${paper.file}" download>Download PDF</a>
      </div>
      <div class="frame-shell">
        <iframe src="${paper.file}" title="${paper.title} notes"></iframe>
      </div>
    `;
  } else {
    content.innerHTML = `
      <div class="missing">
        <p>Notes not found for this link.</p>
        <p><a href="bed-notes.html">Go back to the B.Ed. notes list</a></p>
      </div>
    `;
  }
</script>
</body>
</html>
