<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B.Ed. Notes Viewer | Omkar EduHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-edge:#F1EADA;
    --ink:#2B2B2E;
    --ink-soft:#5A5A62;
    --ring:#9CA3AF;
    --tape:#F4C542;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper-edge);
    color:var(--ink);
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:32px 24px 60px;
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--ink-soft);
    text-decoration:none;
    font-size:.9rem;
    margin-bottom:20px;
  }
  .back:hover{color:var(--ink);}
  .head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  .kicker{
    font-size:.85rem;
    color:var(--ink-soft);
    margin:0 0 4px;
  }
  h1{
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:2.6rem;
    margin:0;
  }
  .download{
    font-size:.9rem;
    color:var(--ink);
    text-decoration:none;
    border:1px solid var(--ink);
    padding:8px 14px;
    white-space:nowrap;
  }
  .download:hover{background:var(--ink); color:var(--paper);}
  .frame-shell{
    position:relative;
    background:#fff;
    border:1px solid #E7DFC8;
    padding:12px;
  }
  .frame-shell::before{
    content:"";
    position:absolute;
    top:-10px; left:24px;
    width:60px; height:20px;
    background:rgba(244,197,66,.55);
    transform:rotate(-3deg);
  }
  iframe{
    width:100%;
    height:80vh;
    border:none;
    display:block;
  }
  .missing{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .missing a{color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="bed-notes.html">← back to all notes</a>

  <div id="content"></div>
</div>

<script>
  // Keep this list identical to the one in bed-notes.html
  const papers = {
    "1.1.1": { title: "Course 1.1.1", file: "notes/bed/1-1-1.pdf" },
    "1.1.2": { title: "Course 1.1.2", file: "notes/bed/1-1-2.pdf" },
    "1.1.4": { title: "Course 1.1.4", file: "notes/bed/1-1-4.pdf" },
    "1.1.5": { title: "Course 1.1.5", file: "notes/bed/1-1-5.pdf" },
    "1.1.EPC-1": { title: "Course 1.1.EPC-1", file: "notes/bed/1-1-epc1.pdf" }
  };

  const params = new URLSearchParams(window.location.search);
  const paperId = params.get("paper");
  const paper = paperId ? papers[paperId] : null;
  const content = document.getElementById("content");

  if (paper) {
    content.innerHTML = `
      <div class="head">
        <div>
          <p class="kicker">${paperId}</p>
          <h1>${paper.title}</h1>
        </div>
        <a class="download" href="${paper.file}" download>Download PDF</a>
      </div>
      <div class="frame-shell">
        <iframe src="${paper.file}" title="${paper.title} notes"></iframe>
      </div>
    `;
  } else {
    content.innerHTML = `
      <div class="missing">
        <p>Notes not found for this link.</p>
        <p><a href="bed-notes.html">Go back to the B.Ed. notes list</a></p>
      </div>
    `;
  }
</script>
</body>
</html>
